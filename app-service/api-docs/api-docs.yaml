components:
  schemas:
    ImageBasicDTO:
      type: object
      properties:
        id:
          type: integer
          format: int32
    LocationDTO:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
    OrderBasicDTO:
      type: object
      properties:
        id:
          type: integer
          format: int32
        product:
          $ref: "#/components/schemas/ProductDTO"
        totalPrice:
          type: number
          format: double
        createdAt:
          type: string
          format: date
        updatedAt:
          type: string
          format: date
    ProductBasicDTO:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        price:
          type: number
          format: double
        user:
          $ref: "#/components/schemas/UserBasicDTO"
        category:
          type: string
    ProductDTO:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        user:
          $ref: "#/components/schemas/UserBasicDTO"
        image:
          $ref: "#/components/schemas/ImageBasicDTO"
        isSold:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        category:
          type: string
    UserBasicDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        surnames:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            type: string
    UserDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        surnames:
          type: string
        email:
          type: string
        image:
          $ref: "#/components/schemas/ImageBasicDTO"
        location:
          $ref: "#/components/schemas/LocationDTO"
        createdAt:
          type: string
          format: date
        roles:
          type: array
          items:
            type: string
        products:
          type: array
          items:
            $ref: "#/components/schemas/ProductBasicDTO"
        orders:
          type: array
          items:
            $ref: "#/components/schemas/OrderBasicDTO"
    ReviewDTO:
      type: object
      properties:
        id:
          type: integer
          format: int32
        product:
          $ref: "#/components/schemas/ProductBasicDTO"
        user:
          $ref: "#/components/schemas/UserBasicDTO"
        description:
          type: string
        date:
          type: string
        rating:
          type: number
          format: float
    OrderDTO:
      type: object
      properties:
        id:
          type: integer
          format: int32
        buyer:
          $ref: "#/components/schemas/UserBasicDTO"
        product:
          $ref: "#/components/schemas/ProductDTO"
        name:
          type: string
        surnames:
          type: string
        address:
          type: string
        apartment:
          type: string
        zipcode:
          type: string
        city:
          type: string
        province:
          type: string
        country:
          type: string
        phone:
          type: string
        creditCardNumber:
          type: string
          writeOnly: true
        creditCardExpiryDate:
          type: string
          writeOnly: true
        creditCardCVV:
          type: string
          writeOnly: true
        totalPrice:
          type: number
          format: double
        createdAt:
          type: string
          format: date
        updatedAt:
          type: string
          format: date
    ImageDTO:
      type: object
      properties:
        id:
          type: integer
          format: int32
        imageFile:
          type: object
          properties:
            binaryStream: {}
    Location:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        latitude:
          type: number
          format: double
        longitude:
